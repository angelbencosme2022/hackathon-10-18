<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Property Analyst 🏡</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>🏡 AI Property Analyst</h1>
            <p>Upload a room photo and receive a detailed, structured marketing analysis</p>
        </header>

        <div class="container">
            <div class="card input-section">
                <h2>Property Input</h2>
                
                <div class="field-group">
                    <label for="userPrompt">💬 Analysis Request</label>
                    <textarea id="userPrompt" placeholder="e.g., Analyze the style and suggest three key marketing features." required>Analyze this empty room. Provide a style assessment, a list of three marketable features, and a short 50-word listing description.</textarea>
                </div>

                <div class="field-group">
                    <label for="imageUpload">📸 Upload Room Photo</label>
                    <input type="file" id="imageUpload" accept="image/*" required>
                </div>

                <div class="image-preview-container">
                    <img id="propertyImage" src="" alt="Uploaded Property Image">
                </div>

                <button id="analyzeButton" onclick="analyzeProperty()">
                    🔍 Analyze Property
                </button>
                
                <div id="loading">Processing your request</div>
            </div>

            <div class="card output-section">
                <h2>AI Analysis <span class="status-indicator"></span></h2>
                <div id="outputDisplay">
                    <p>Upload an image and click "Analyze Property" to see the structured JSON results here.</p>
                    <pre id="jsonOutput"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
